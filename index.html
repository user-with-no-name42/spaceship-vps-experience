adius:5px}footer{margin-top:35px;border-top:1px solid #343434;padding-top:18px}footer p{margin:8px 0} @media(max-width:600px){main{padding:25px 16px 30px}body{font-size:17px}.shots{gap:14px}h1{margin-bottom:22px}blockquote{font-size:18px;padding-left:17px}}</style></head><body><main><header><h1>The provider HAS NO WAY to undo the consequences of its own mistakes.</h1></header><section class="evidence"><div class="shots" id="screenshots" role="region" aria-label="Support screenshots" tabindex="0"><figure><a href="screenshots/01-questions-and-confirmations.png" target="_blank" rel="noopener" aria-label="Open screenshot: Evidence 03 · The initial questions and answers."><img src="screenshots/01-questions-and-confirmations.png" alt="Evidence 03 · The initial questions and answers." width="960" height="647"></a><figcaption>Evidence 03</figcaption></figure><figure><a href="screenshots/04-later-response-with-context.png" target="_blank" rel="noopener" aria-label="Open screenshot: Evidence 05 · “This is how our system works.”"><img src="screenshots/04-later-response-with-context.png" alt="Evidence 05 · “This is how our system works.”" width="960" height="647"></a><figcaption>Evidence 05</figcaption></figure><figure><a href="screenshots/07-security-check-clarification.png" target="_blank" rel="noopener" aria-label="Open screenshot: Evidence 07 · The later security explanation."><img src="screenshots/07-security-check-clarification.png" alt="Evidence 07 · The later security explanation." width="960" height="647"></a><figcaption>Evidence 07</figcaption></figure></div><div class="carousel-controls"><button type="button" id="previous" aria-label="Previous screenshot" aria-controls="screenshots" disabled>←</button><span class="counter" id="counter" aria-live="polite">1 / 3</span><button type="button" id="next" aria-label="Next screenshot" aria-controls="screenshots">→</button></div></section></main><script>(()=>{const track=document.getElementById('screenshots'),slides=[...track.querySelectorAll('figure')],previous=document.getElementById('previous'),next=document.getElementById('next'),counter=document.getElementById('counter');let index=0;function update(){const step=slides.length>1?slides[1].offsetLeft-slides[0].offsetLeft:track.clientWidth;index=Math.max(0,Math.min(slides.length-1,Math.round(track.scrollLeft/step)));previous.disabled=index===0;next.disabled=index===slides.length-1;counter.textContent=(index+1)+' / '+slides.length}function move(delta){const target=Math.max(0,Math.min(slides.length-1,index+delta));track.scrollTo({left:slides[target].offsetLeft-slides[0].offsetLeft,behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'})}previous.addEventListener('click',()=>move(-1));next.addEventListener('click',()=>move(1));track.addEventListener('scroll',update,{passive:true});track.addEventListener('keydown',event=>{if(event.target===track&&(event.key==='ArrowRight'||event.key==='ArrowLeft')){event.preventDefault();move(event.key==='ArrowRight'?1:-1)}});window.addEventListener('resize',update);update()})();</script></body></html>
